name: Generate & Upload GMC Feed
on:
  schedule:
    - cron: '0 16 * * *' # 00:00 MYT
  workflow_dispatch:

jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Generate GMC XML Feed
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: node scripts/generate-gmc-feed.js

      - name: Commit Feed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add public/*.xml
          git commit -m "auto update gmc feed" || echo "No changes"
          git push

      - name: Upload Feed to GMC
        env:
          GMC_MERCHANT_ID: ${{ secrets.GMC_MERCHANT_ID }}
          GMC_PRIVATE_KEY: ${{ secrets.GMC_PRIVATE_KEY }}
        run: node scripts/upload-gmc-feed.js
